<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompareAll - Find the Best Food Deals</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #0f172a;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(#60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
        }
        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
        .mockup {
            margin-top: 4rem;
            max-width: 300px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 8px solid #1e293b;
        }
    </style>
</head>
<body>
    <h1>CompareAll</h1>
    <p>The only app you need to compare food prices across Swiggy, Zomato, EatSure, and more in real-time. Never overpay for your favorite meals again.</p>
    <a href="https://play.google.com/store/apps/details?id=in.compareall.app" class="btn">Download on Google Play</a>
    
    <script>
        // Redirect to app if opened on a mobile device and app is installed
        // The intent filter in the app will catch this URL if installed.
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var query = urlParams.get('q');
            if (query && /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                // If it's a search link and on mobile, try to open the app via custom scheme as fallback
                setTimeout(function() {
                    window.location.href = "compareall://search?q=" + encodeURIComponent(query);
                }, 500);
            }
        };
    </script>
</body>
</html>
