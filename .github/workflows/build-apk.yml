name: Build Expo APK

on:
  push:
    branches:
      - main
      - integrate_account_data_comparison
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies (Root)
        run: npm install --legacy-peer-deps

      - name: Install Dependencies (Mobile)
        run: |
          cd apps/mobile
          npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompareAll-Debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
