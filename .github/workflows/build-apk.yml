name: Build Expo APK

on:
  push:
    branches:
      - main
      - integrate_account_data_comparison
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Dependencies
        run: |
          cd apps/mobile
          npm install --legacy-peer-deps

      - name: Run EAS Build (Local APK)
        run: |
          cd apps/mobile
          eas build -p android --profile preview --local --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompareAll-Native-App.apk
          path: apps/mobile/build/*.apk
